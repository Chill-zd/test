[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polishpaper"
version = "0.4.8"
description = "Source-bound academic manuscript polishing"
requires-python = ">=3.10"
dependencies = [
  "openai==2.6.0", "pylatexenc==2.10", "sentence-transformers==5.1.2",
  "numpy==2.2.6", "PyYAML==6.0.3", "jsonschema==4.25.1",
  "click==8.2.1", "rich==14.2.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
polishpaper = "polishpaper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polishpaper*"]

[tool.setuptools.package-data]
polishpaper = ["prompts/*.md", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
